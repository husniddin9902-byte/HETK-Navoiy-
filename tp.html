<!DOCTYPE html>

<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TP ma'lumotlari</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{
font-family: Arial, sans-serif;
background:#0f172a;
color:white;
margin:0;
padding:20px;
}

.card{
background:#1e293b;
border-radius:12px;
padding:20px;
max-width:900px;
margin:auto;
}

.title{
font-size:24px;
font-weight:bold;
margin-bottom:15px;
}

.row{
margin:8px 0;
}

.label{
color:#94a3b8;
}

.gallery{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

.gallery img{
width:120px;
height:120px;
object-fit:cover;
border-radius:8px;
cursor:pointer;
}

.full-image{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.full-image img{
max-width:95%;
max-height:95%;
}
</style>

</head>

<body>

<div class="card" id="tp-container">
Yuklanmoqda...
</div>

<div class="full-image" id="viewer">
<img id="viewer-img">
</div>

<script>

const firebaseConfig = {
apiKey: "AIzaSyBFOoT_ZhvE1tT1Qglh5GjPPhs8ZsyRWoc",
authDomain: "energo-monitoring.firebaseapp.com",
databaseURL: "https://energo-monitoring-default-rtdb.firebaseio.com",
projectId: "energo-monitoring",
storageBucket: "energo-monitoring.firebasestorage.app",
messagingSenderId: "514032923022",
appId: "1:514032923022:web:fe2f57b81a30d0c2fd74df"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

const params = new URLSearchParams(location.search);
const tpId = params.get("id");

if(!tpId){
document.getElementById("tp-container").innerHTML =
"TP ID topilmadi";
}

database.ref("TPs/"+tpId).once("value")
.then(snapshot=>{

const tp = snapshot.val();

  
if(!tp){
document.getElementById("tp-container").innerHTML =
"TP topilmadi";
return;
}

let html = `
<div class="title">${tp.name || "-"}</div>

<div class="row"><span class="label">Balans:</span>
${tp.isPrivate ? "🔴 XUSUSIY" : "🔵 ETK"}
</div>

<div class="row"><span class="label">Manzil:</span>
${tp.address || "-"}
</div>

<div class="row"><span class="label">Kenglik:</span>
${tp.lat || "-"}
</div>

<div class="row"><span class="label">Uzunlik:</span>
${tp.lng || "-"}
</div>

<div class="row"><span class="label">Javobgar:</span>
${tp.responsiblePerson || "-"}
</div>

<div class="row"><span class="label">Telefon:</span>
${tp.responsiblePhone || "-"}
</div>
`;

if(tp.isPrivate){
html += `
<div class="row"><span class="label">Korxona:</span>
${tp.ownerFirm || "-"}
</div>

<div class="row"><span class="label">Korxona vakili:</span>
${tp.ownerName || "-"}
</div>

<div class="row"><span class="label">Korxona telefoni:</span>
${tp.ownerPhone || "-"}
</div>

<div class="row"><span class="label">Hisoblagich:</span>
${tp.meterNumber || "-"}
</div>
`;
}

html += `<div class="gallery">`;

(tp.images || []).forEach(img=>{
if(img.url){
html += `
<img src="${img.url}"
onclick="showImage('${img.url}')">
`;
}
});

html += `</div>`;

document.getElementById("tp-container").innerHTML =
html;

});

function showImage(url){
document.getElementById("viewer").style.display="flex";
document.getElementById("viewer-img").src=url;
}

document.getElementById("viewer")
.onclick = ()=>{
document.getElementById("viewer").style.display="none";
};

</script>

</body>
</html>
