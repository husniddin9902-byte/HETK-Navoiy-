<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HETK Navoiy - Monitoring</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <button id="side-menu-btn" class="icon-btn"><i class="fas fa-bars"></i></button>
        <div class="header-title">Joylashuvni saqlash</div>
        <div class="header-right">
            <button id="list-btn" class="icon-btn"><i class="fas fa-list-ul"></i></button>
            <div class="map-type-indicator"></div>
        </div>
    </div>

    <div id="map"></div>

    <button id="locate-btn" class="map-overlay-btn"><i class="fas fa-crosshairs"></i></button>

    <div class="bottom-panel">
        <button id="toggle-info" class="toggle-btn">
            <i class="fas fa-chevron-up"></i>
        </button>

        <div id="info-panel" class="info-panel hidden">
            <div class="accuracy-text">Accurate to 4 meters</div>
            <div class="info-content">
                <div class="info-text">
                    <p><strong>Latitude:</strong> <span id="latitude">0.000000</span></p>
                    <p><strong>Longitude:</strong> <span id="longitude">0.000000</span></p>
                    <p><strong>Address:</strong> <span id="address">Aniqlanmoqda...</span></p>
                </div>
                <button id="copy-btn" class="copy-icon-btn"><i class="far fa-copy"></i><br><span>Copy</span></button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="main-btn save-btn">Save Location</button>
            <button class="main-btn share-btn">Share Location</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
