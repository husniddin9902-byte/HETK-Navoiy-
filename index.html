<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energo Monitoring</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOADER -->
<div id="app-loader" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#001b2e;
z-index:99999;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
color:white;
font-size:24px;
">

<div style="
width:70px;
height:70px;
border:6px solid #0d6efd;
border-top:6px solid transparent;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:20px;
"></div>

<div>Baza yuklanmoqda...</div>

</div>


<!-- HEADER -->
<div class="header-panel">

<button id="list-btn">☰</button>

<div class="header-title">
HETK Navoiy
</div>

<button id="map-type-btn">🛰️</button>

</div>


<!-- XARITA -->
<div id="map"></div>


<!-- PANEL -->
<div id="list-container" class="list-modal">

<div class="list-content full-screen">

<div class="list-header">

<h3>Boshqaruv paneli</h3>

<button id="close-list">✕</button>

</div>


<div class="tab-control">

<button id="tab-folders" class="tab-btn active">
Guruhlar
</button>

<button id="tab-items" class="tab-btn">
Xarita
</button>

</div>


<!-- GURUHLAR -->
<div id="folders-section" class="tab-content active">

<div id="tree-root"></div>

</div>


<!-- XARITA -->
<div id="items-section"
class="tab-content"
style="display:none;">

<div id="panel-map"
style="
width:100%;
height:500px;
border-radius:16px;
"></div>

</div>

</div>

</div>


<!-- GPS -->
<button id="locate-btn"
style="
position:fixed;
right:20px;
bottom:100px;
z-index:9999;
width:60px;
height:60px;
border:none;
border-radius:50%;
background:#0d6efd;
color:white;
font-size:24px;
">
📍
</button>
    
<div id="app-loader">
    <div class="loader-circle"></div>
    <p>Baza yuklanmoqda...</p>
</div>

<header class="topbar">
    <button id="menu-btn">
        <i class="fas fa-bars"></i>
    </button>

    <h1>Energo Monitoring</h1>

    <button id="panel-btn">
        <i class="fas fa-list"></i>
    </button>
</header>

<div id="map"></div>

<button id="locate-btn">
    <i class="fas fa-crosshairs"></i>
</button>

<section class="bottom-panel minimized" id="bottom-panel">

    <div class="panel-toggle" id="panel-toggle">
        <i class="fas fa-chevron-up"></i>
    </div>

    <div class="panel-content">

        <div class="coord-row">
            <span>Latitude</span>
            <span id="latitude">0</span>
        </div>

        <div class="coord-row">
            <span>Longitude</span>
            <span id="longitude">0</span>
        </div>

        <div class="coord-row address-row">
            <span>Address</span>
            <span id="address">Aniqlanmoqda...</span>
        </div>

    </div>

    <div class="bottom-actions">
        <button id="save-location-btn" class="blue-btn">
            Save Location
        </button>

        <button id="share-location-btn" class="green-btn">
            Share Location
        </button>
    </div>

</section>

<div class="panel-overlay hidden" id="panel-overlay">

    <div class="management-panel">

        <div class="management-header">
            <h2>Boshqaruv paneli</h2>

            <button id="close-panel-btn">
                ×
            </button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="folders">
                Guruhlar
            </button>

            <button class="tab-btn" data-tab="panel-map">
                Xarita
            </button>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Qidirish...">
        </div>

        <div id="folders-tab" class="tab-content active">

            <div id="tree-root"></div>

            <button id="add-folder-btn" class="main-action-btn">
                + Yangi guruh qo'shish
            </button>

        </div>

        <div id="panel-map-tab" class="tab-content">
            <div id="panel-map"></div>
        </div>

    </div>

</div>

<div class="bottom-sheet hidden" id="folder-sheet">

    <div class="sheet-header">
        <h3>Guruh yaratish</h3>
    </div>

    <input type="text" id="folder-name" placeholder="Guruh nomi">

    <input type="color" id="folder-color" value="#00ff00">

    <button id="save-folder-btn" class="blue-btn">
        Saqlash
    </button>

</div>

<div class="bottom-sheet hidden" id="element-sheet">

    <div class="sheet-header">
        <h3>Element qo'shish</h3>
    </div>

    <input type="text" id="element-name" placeholder="Element nomi">

    <input type="number" id="element-lat" placeholder="Latitude">

    <input type="number" id="element-lng" placeholder="Longitude">

    <textarea id="element-note" placeholder="Izoh"></textarea>

    <button id="save-element-btn" class="blue-btn">
        Saqlash
    </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script src="app.js"></script>
<style>

@keyframes spin{

0%{
transform:rotate(0deg);
}

100%{
transform:rotate(360deg);
}

}

</style>r
</body>
</html>
