<!DOCTYPE html>
<html lang="uz">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>HETK Monitoring</title>

<!-- LEAFLET -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<!-- CSS -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar">

    <div class="sidebar-header">
        HETK MENU
    </div>

    <div class="sidebar-content">

        <button class="menu-item">
            📁 Papkalar
        </button>

        <button class="menu-item">
            ➕ Element qo‘shish
        </button>

        <button class="menu-item">
            ⚙ Sozlamalar
        </button>

    </div>

</div>

<div id="sidebarBackdrop"></div>
    
<!-- ========================= -->
<!-- LOADER -->
<!-- ========================= -->

<div id="app-loader">

    <div class="loader-circle"></div>

    <div class="loader-text">
        Baza yuklanmoqda...
    </div>

</div>


<!-- ========================= -->
<!-- TOP HEADER -->
<!-- ========================= -->

<header class="top-header">

    <div class="header-left">

        <button id="menu-btn" class="icon-btn">
            <i class="fas fa-bars"></i>
        </button>

    </div>


    <div class="header-title">

        HETK Monitoring

    </div>


    <div class="header-right">

        <button id="search-btn" class="icon-btn">
            <i class="fas fa-search"></i>
        </button>

        <button id="map-type-btn" class="icon-btn">
            <i class="fas fa-layer-group"></i>
        </button>

    </div>

</header>


<!-- ========================= -->
<!-- SEARCH PANEL -->
<!-- ========================= -->

<div id="search-panel" class="hidden">

    <div class="search-box">

        <i class="fas fa-search"></i>

        <input
        type="text"
        id="global-search-input"
        placeholder="Qidirish...">

    </div>

</div>


<!-- ========================= -->
<!-- MAIN MAP -->
<!-- ========================= -->

<div id="map"></div>


<!-- ========================= -->
<!-- GPS BUTTON -->
<!-- ========================= -->

<button id="locate-btn">

    <i class="fas fa-location-crosshairs"></i>

</button>


<!-- ========================= -->
<!-- BOTTOM INFO PANEL -->
<!-- ========================= -->

<div id="bottom-panel" class="minimized">

    <div id="panel-toggle">

        <i class="fas fa-chevron-up"></i>

    </div>


    <div id="panel-content">

        <div class="coords-grid">

            <div class="coord-item">

                <div class="coord-label">
                    Latitude
                </div>

                <div id="latitude" class="coord-value">
                    0.000000
                </div>

            </div>


            <div class="coord-item">

                <div class="coord-label">
                    Longitude
                </div>

                <div id="longitude" class="coord-value">
                    0.000000
                </div>

            </div>

        </div>


        <div class="address-box">

            <div class="address-label">
                Address
            </div>

            <div id="address">
                Aniqlanmoqda...
            </div>

        </div>


        <div class="bottom-actions">

            <button id="copy-btn" class="action-btn blue-btn">

                <i class="fas fa-copy"></i>

                Copy

            </button>


            <button id="share-btn" class="action-btn green-btn">

                <i class="fas fa-share"></i>

                Share

            </button>


            <button id="save-btn" class="action-btn red-btn">

                <i class="fas fa-floppy-disk"></i>

                Save

            </button>

        </div>

    </div>

</div>


<!-- ========================= -->
<!-- SIDE PANEL -->
<!-- ========================= -->

<div id="side-panel">

    <div class="side-overlay"></div>

    <div class="side-content">


        <!-- HEADER -->

        <div class="side-header">

            <div class="side-title">

                Monitoring Panel

            </div>


            <button id="close-panel-btn">

                <i class="fas fa-xmark"></i>

            </button>

        </div>


        <!-- TABS -->

        <div class="panel-tabs">

            <button id="folders-tab-btn"
            class="panel-tab active">

                Guruhlar

            </button>


            <button id="map-tab-btn"
            class="panel-tab">

                Xarita

            </button>

        </div>


        <!-- SEARCH -->

        <div class="panel-search">

            <i class="fas fa-search"></i>

            <input
            type="text"
            id="folder-search-input"
            placeholder="Guruh yoki lokatsiya qidirish">

        </div>


        <!-- FOLDERS TAB -->

        <div id="folders-tab"
        class="tab-page active">

            <div id="tree-root"></div>


            <button id="add-folder-btn"
            class="main-add-btn">

                <i class="fas fa-folder-plus"></i>

                Yangi guruh

            </button>

        </div>


        <!-- MAP TAB -->

        <div id="map-tab"
        class="tab-page">

            <div id="panel-map"></div>

        </div>

    </div>

</div>


<!-- ========================= -->
<!-- ADD FOLDER MODAL -->
<!-- ========================= -->

<div id="folder-modal"
class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <div class="modal-title">

                Yangi guruh

            </div>


            <button class="close-modal-btn">

                <i class="fas fa-xmark"></i>

            </button>

        </div>


        <div class="modal-body">

            <input
            type="text"
            id="folder-name-input"
            class="custom-input"
            placeholder="Guruh nomi">


            <label class="custom-label">

                Rang

            </label>

            <input
            type="color"
            id="folder-color-input"
            value="#00aaff">


            <label class="custom-label">

                Ona guruh

            </label>

            <div id="folder-parent-tree"
            class="tree-select"></div>


            <button id="save-folder-btn"
            class="save-main-btn">

                Saqlash

            </button>

        </div>

    </div>

</div>


<!-- ========================= -->
<!-- ELEMENT MODAL -->
<!-- ========================= -->

<div id="element-modal"
class="modal hidden">

    <div class="modal-content large-modal">

        <div class="modal-header">

            <div class="modal-title">

                Lokatsiya

            </div>


            <button class="close-element-modal">

                <i class="fas fa-xmark"></i>

            </button>

        </div>


        <div class="modal-body">


            <!-- IMAGE -->

            <div class="image-upload-box">

                <input
                type="file"
                id="element-image-input"
                accept="image/*">

                <img
                id="element-image-preview"
                src="">

            </div>


            <!-- NAME -->

            <input
            type="text"
            id="element-name-input"
            class="custom-input"
            placeholder="Lokatsiya nomi">


            <!-- PHONE -->

            <input
            type="tel"
            id="element-phone-input"
            class="custom-input"
            placeholder="+998">


            <!-- NOTE -->

            <textarea
            id="element-note-input"
            class="custom-textarea"
            placeholder="Izoh"></textarea>


            <!-- COORDS -->

            <div class="coords-double">

                <input
                type="number"
                id="element-lat-input"
                class="custom-input"
                placeholder="Latitude">


                <input
                type="number"
                id="element-lng-input"
                class="custom-input"
                placeholder="Longitude">

            </div>


            <!-- MULTI FOLDER -->

            <div class="custom-label">

                Guruhlar

            </div>

            <div id="element-folder-tree"
            class="tree-select"></div>


            <!-- BUTTONS -->

            <div class="element-actions">

                <button id="delete-element-btn"
                class="danger-btn">

                    O‘chirish

                </button>


                <button id="save-element-btn"
                class="save-main-btn">

                    Saqlash

                </button>

            </div>

        </div>

    </div>

</div>


<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>


<!-- LEAFLET -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- APP -->

<script src="app.js"></script>

</body>
</html>
