<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HETK Navoiy</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <button class="icon-btn"><i class="fas fa-bars"></i></button>
        <div class="header-title">Joylashuvni saqlash</div>
        <button class="icon-btn"><i class="fas fa-list-ul"></i></button>
    </div>

    <div id="map"></div>

    <button id="locate-btn" class="map-overlay-btn"><i class="fas fa-crosshairs"></i></button>

    <div class="bottom-panel">
        <button id="toggle-info" class="toggle-btn"><i class="fas fa-chevron-up"></i></button>
        <div id="info-panel" class="info-panel hidden">
            <p>Lat: <span id="latitude">0.00</span></p>
            <p>Long: <span id="longitude">0.00</span></p>
            <p id="accuracy-text" style="font-size: 10px; color: #aaa;"></p>
        </div>
        <div class="action-buttons">
            <button class="main-btn save-btn">Save Location</button>
            <button class="main-btn share-btn">Share Location</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
