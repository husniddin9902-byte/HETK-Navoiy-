<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HETK Navoiy</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="header-title">Joylashuvni saqlash</div>
    </div>

    <div id="map" style="width: 100%; height: 100vh;"></div>

    <button id="locate-btn" class="map-overlay-btn"><i class="fas fa-crosshairs"></i></button>

    <div class="bottom-panel">
        <div id="info-panel" class="info-panel">
            <p>Lat: <span id="latitude">0.00</span> | Long: <span id="longitude">0.00</span></p>
        </div>
        <div class="action-buttons">
            <button class="main-btn save-btn">Save Location</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
