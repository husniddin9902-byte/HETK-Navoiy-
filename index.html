<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HETK Monitoring</title>

    <!-- LEAFLET -->

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- ICONS -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- LOADER -->

    <div id="loader">

        <div class="spinner"></div>

        <p>Baza yuklanmoqda...</p>

    </div>

    <!-- SIDEBAR -->

    <div class="sidebar"
         id="sidebar">

        <div class="sidebar-header">

            <h2>Monitoring Panel</h2>

            <button onclick="closeSidebar()">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <div class="sidebar-tabs">

            <button class="tab-btn active">
                Guruhlar
            </button>

            <button class="tab-btn">
                Xarita
            </button>

        </div>

        <div class="sidebar-search">

            <input type="text"
                   placeholder="Guruh yoki lokatsiya qidirish">
        </div>

        <button class="new-group-btn"
                onclick="openSaveModal()">

            <i class="fa-solid fa-folder-plus"></i>

            Yangi guruh

        </button>

        <div id="groupsList"></div>

    </div>

    <!-- TOPBAR -->

    <div class="topbar">

        <button class="icon-btn"
                onclick="openSidebar()">

            <i class="fa-solid fa-bars"></i>

        </button>

        <h1>HETK Monitoring</h1>

        <div class="topbar-right">

            <button class="icon-btn"
                    onclick="searchLocation()">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

            <button class="icon-btn"
                    onclick="toggleLayer()">

                <i class="fa-solid fa-layer-group"></i>

            </button>

        </div>

    </div>

    <!-- SEARCH -->

    <div class="search-box">

        <input type="text"
               id="searchInput"
               placeholder="Lokatsiya qidirish...">

    </div>

    <!-- MAP -->

    <div id="map"></div>

    <!-- GPS -->

    <button class="gps-btn"
            onclick="getCurrentLocation()">

        <i class="fa-solid fa-location-crosshairs"></i>

    </button>

    <!-- BOTTOM PANEL -->

    <div class="bottom-panel">

        <div class="drag-line"></div>

        <div class="info-box">

            <span>Latitude</span>

            <h3 id="latitude">0.000000</h3>

        </div>

        <div class="info-box">

            <span>Longitude</span>

            <h3 id="longitude">0.000000</h3>

        </div>

        <div class="info-box">

            <span>Address</span>

            <h3 id="address">Aniqlanmoqda...</h3>

        </div>

        <button class="copy-btn"
                onclick="copyCoordinates()">

            <i class="fa-regular fa-copy"></i>

            Copy

        </button>

        <button class="share-btn"
                onclick="shareLocation()">

            <i class="fa-solid fa-share"></i>

            Share

        </button>

        <button class="save-btn"
                onclick="openSaveModal()">

            <i class="fa-regular fa-floppy-disk"></i>

            Save

        </button>

    </div>

    <!-- SAVE MODAL -->

    <div class="modal"
         id="saveModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Lokatsiya</h2>

                <button onclick="closeSaveModal()">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

            <input type="text"
                   id="locationName"
                   placeholder="Lokatsiya nomi">

            <input type="text"
                   id="locationPhone"
                   placeholder="+998">

            <textarea id="locationNote"
                      placeholder="Izoh"></textarea>

            <input type="text"
                   id="modalAddress"
                   placeholder="Manzil">

            <input type="text"
                   id="groupName"
                   placeholder="Yangi guruh nomi">

            <button class="new-group-btn"
                    onclick="saveGroup()">

                + Guruh qo‘shish

            </button>

            <select id="locationGroup"></select>

            <button class="share-btn"
                    onclick="saveLocation()">

                Saqlash

            </button>

        </div>

    </div>

    <!-- LEAFLET JS -->

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- APP JS -->

    <script src="app.js"></script>

</body>

</html>
