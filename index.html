<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HETK Monitoring</title>

    <!-- LEAFLET -->

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- ICONS -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- LOADER -->

    <div id="loader">

        <div class="spinner"></div>

        <p>Monitoring yuklanmoqda...</p>

    </div>

    <!-- SIDEBAR -->

    <div class="sidebar"
         id="sidebar">

        <div class="sidebar-header">

            <h2>Menu</h2>

            <button onclick="closeSidebar()">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div class="sidebar-content">

            <button class="menu-item">

                <i class="fa-solid fa-folder"></i>

                Papkalar

            </button>

            <button class="menu-item">

                <i class="fa-solid fa-location-dot"></i>

                Lokatsiyalar

            </button>

            <button class="menu-item">

                <i class="fa-solid fa-gear"></i>

                Sozlamalar

            </button>

        </div>

    </div>

    <!-- TOPBAR -->

    <div class="topbar">

        <button class="top-btn"
                onclick="openSidebar()">

            <i class="fa-solid fa-bars"></i>

        </button>

        <h1>HETK Monitoring</h1>

        <div class="top-actions">

            <button class="top-btn"
                    onclick="searchLocation()">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

            <button class="top-btn"
                    onclick="toggleLayer()">

                <i class="fa-solid fa-layer-group"></i>

            </button>

        </div>

    </div>

    <!-- SEARCH -->

    <div class="search-container">

        <input type="text"
               id="searchInput"
               placeholder="Lokatsiya qidirish...">

    </div>

    <!-- MAP -->

    <div id="map"></div>

    <!-- GPS -->

    <button class="gps-btn"
            onclick="getCurrentLocation()">

        <i class="fa-solid fa-location-crosshairs"></i>

    </button>

    <!-- BOTTOM SHEET -->

    <div class="bottom-sheet"
         id="bottomSheet">

        <div class="sheet-handle"></div>

        <div class="sheet-content">

            <div class="info-card">

                <span>Latitude</span>

                <h2 id="latitude">0.000000</h2>

            </div>

            <div class="info-card">

                <span>Longitude</span>

                <h2 id="longitude">0.000000</h2>

            </div>

            <div class="info-card">

                <span>Address</span>

                <p id="address">Aniqlanmoqda...</p>

            </div>

            <button class="action-btn blue-btn"
                    onclick="copyCoordinates()">

                <i class="fa-regular fa-copy"></i>

                Copy

            </button>

            <button class="action-btn green-btn"
                    onclick="shareLocation()">

                <i class="fa-solid fa-share"></i>

                Share

            </button>

        </div>

    </div>

    <!-- LEAFLET -->

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- APP -->

    <script src="app.js"></script>

</body>

</html>
